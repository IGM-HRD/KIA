<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 활용 판매상담 Skill-up · 프롬프트 모음집</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F3F5F8;
  --surface:#FFFFFF;
  --surface2:#F7F9FB;
  --panel:#F4F6F9;
  --line:#E2E7ED;
  --line2:#CDD5DE;
  --text:#0A1620;
  --text2:#2E3A48;
  --muted:#667487;
  --accent:#0E5BD8;
  --accent-ink:#FFFFFF;
  --accent-soft:#E7EFFC;
  --warn:#D2352B;
  --warn-soft:#FDECEA;
  --ok:#14866D;
  --hero:#05141F;
  --hero2:#0C2536;
  --shadow:0 1px 2px rgba(10,22,32,.04),0 4px 16px rgba(10,22,32,.05);
  --shadow-hi:0 2px 4px rgba(10,22,32,.05),0 12px 32px rgba(10,22,32,.09);
  --radius:18px;
  --scale:1;
  /* 유형 배지 */
  --t-input-bg:#0E5BD8; --t-input-fg:#FFFFFF;
  --t-next-bg:#E7EFFC;  --t-next-fg:#0E4FB8;
  --t-fix-bg:#EEF1F4;   --t-fix-fg:#4A5868;
  --t-inst-bg:#EFEAFD;  --t-inst-fg:#5B3CC4;
  --t-build-bg:#E3F5EF; --t-build-fg:#0F7258;
  --t-theory-bg:transparent; --t-theory-fg:#667487;
}
html[data-theme="dark"]{
  --bg:#070D14;
  --surface:#0E1721;
  --surface2:#121D29;
  --panel:#0A121B;
  --line:#1E2B3A;
  --line2:#2B3B4E;
  --text:#ECF1F7;
  --text2:#C5CFDB;
  --muted:#8796A9;
  --accent:#5E9BFF;
  --accent-ink:#06101C;
  --accent-soft:#132744;
  --warn:#FF7A6E;
  --warn-soft:#2A1513;
  --ok:#3CC79F;
  --hero:#03090F;
  --hero2:#0A1C2A;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --shadow-hi:0 8px 28px rgba(0,0,0,.45);
  --t-input-bg:#5E9BFF; --t-input-fg:#06101C;
  --t-next-bg:#132744;  --t-next-fg:#8DB8FF;
  --t-fix-bg:#18222E;   --t-fix-fg:#A9B6C6;
  --t-inst-bg:#221A3D;  --t-inst-fg:#B9A5FF;
  --t-build-bg:#0F2A23; --t-build-fg:#5FD6B0;
  --t-theory-bg:transparent; --t-theory-fg:#8796A9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:150px}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.6;letter-spacing:-.01em;
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;
  transition:background .25s,color .25s;
}
button{font-family:inherit}
svg{display:block}

/* ---------- 히어로 ---------- */
.hero{
  position:relative;overflow:hidden;color:#fff;
  background:
    radial-gradient(900px 420px at 88% -10%,rgba(94,155,255,.28),transparent 60%),
    radial-gradient(600px 300px at -5% 110%,rgba(60,199,159,.12),transparent 60%),
    linear-gradient(160deg,var(--hero2) 0%,var(--hero) 70%);
}
.hero::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 95%);mask-image:linear-gradient(180deg,#000 0%,transparent 95%);
}
.hero-in{position:relative;max-width:1040px;margin:0 auto;padding:52px 24px 40px;display:grid;grid-template-columns:1fr auto;gap:32px;align-items:end}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12.5px;letter-spacing:.12em;color:#A9C8FF;font-weight:700;margin-bottom:16px;
}
.eyebrow::before{content:"";width:18px;height:2px;background:#5E9BFF;border-radius:2px}
h1{margin:0 0 12px;font-size:clamp(28px,4.4vw,42px);line-height:1.2;letter-spacing:-.035em;font-weight:800}
h1 .h1-sub{display:block;color:#9FB3C8;font-weight:700}
.sub{margin:0;color:#B9C7D6;font-size:15px;max-width:560px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.stat{
  display:flex;align-items:baseline;gap:6px;padding:9px 14px;border-radius:12px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(6px);
  font-size:13px;color:#B9C7D6;
}
.stat b{font-size:18px;color:#fff;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* 7차시 상승 막대 (차시 바로가기) */
.rising{display:flex;align-items:flex-end;gap:7px;height:132px}
.rising button{
  position:relative;width:30px;border:none;padding:0;cursor:pointer;border-radius:7px 7px 3px 3px;
  background:linear-gradient(180deg,rgba(94,155,255,.55),rgba(94,155,255,.16));
  transition:transform .18s,background .18s;
}
.rising button:nth-child(1){height:22%}.rising button:nth-child(2){height:34%}
.rising button:nth-child(3){height:46%}.rising button:nth-child(4){height:58%}
.rising button:nth-child(5){height:70%}.rising button:nth-child(6){height:84%}
.rising button:nth-child(7){height:100%;background:linear-gradient(180deg,#7DB0FF,#2F73E0)}
.rising button span{position:absolute;left:0;right:0;top:-22px;text-align:center;font-size:12px;font-weight:800;color:#9FB3C8}
.rising button:hover,.rising button:focus-visible{transform:translateY(-4px);background:linear-gradient(180deg,#9CC2FF,#3A7EEA);outline:none}
.rising button:hover span{color:#fff}

/* ---------- 툴바 ---------- */
.toolbar{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  -webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid var(--line);
}
.toolbar-in{max-width:1040px;margin:0 auto;padding:14px 24px 10px}
.searchrow{display:flex;gap:8px;align-items:center}
.search{position:relative;flex:1;min-width:0}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
#q{
  width:100%;background:var(--surface);border:1px solid var(--line);
  color:var(--text);border-radius:12px;padding:12px 14px 12px 42px;font-size:15px;
  font-family:inherit;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s;
}
#q::placeholder{color:var(--muted)}
#q:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.ctrl{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.iconbtn{
  background:transparent;border:none;color:var(--text2);
  padding:0 13px;height:46px;font-size:14px;cursor:pointer;white-space:nowrap;font-weight:700;
  display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;
}
.iconbtn + .iconbtn{border-left:1px solid var(--line)}
.iconbtn:hover{background:var(--surface2);color:var(--text)}
.iconbtn:active{background:var(--accent-soft)}
.iconbtn svg{width:18px;height:18px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding:2px 0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:1px;
  background:var(--surface);border:1px solid var(--line);color:var(--text2);
  border-radius:12px;padding:7px 14px 8px;cursor:pointer;text-align:left;
  transition:background .15s,border-color .15s,color .15s,transform .15s;
}
.tab b{font-size:14px;font-weight:800;line-height:1.3}
.tab small{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.3;white-space:nowrap}
.tab:hover{border-color:var(--line2)}
.tab[aria-selected="true"]{background:var(--text);border-color:var(--text);color:var(--bg)}
.tab[aria-selected="true"] small{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.counts{margin-top:6px;font-size:12.5px;color:var(--muted);font-weight:600}

/* ---------- 본문 ---------- */
main{padding:8px 24px 110px;max-width:1040px;margin:0 auto}

.session{margin-top:56px}
.session-head{
  display:flex;align-items:center;gap:20px;padding:0 0 18px;margin-bottom:6px;
  border-bottom:1px solid var(--line);
}
.session-num{
  flex:0 0 auto;width:72px;height:72px;border-radius:20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--text);color:var(--bg);
}
.session-num small{font-size:10.5px;font-weight:700;letter-spacing:.08em;opacity:.65;line-height:1}
.session-num b{font-size:32px;font-weight:800;line-height:1.05;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.session-stage{
  display:inline-block;font-size:12.5px;color:var(--accent);font-weight:800;letter-spacing:.01em;
  background:var(--accent-soft);padding:3px 10px;border-radius:999px;margin-bottom:6px;
}
.session-title{font-size:calc(24px * var(--scale));font-weight:800;margin:0;letter-spacing:-.03em;line-height:1.3}

.chapter{margin-top:30px}
.chapter-title{
  display:flex;align-items:center;gap:10px;
  font-size:calc(16px * var(--scale));font-weight:800;margin:0 0 14px;letter-spacing:-.02em;color:var(--text2);
}
.chapter-title::after{content:"";flex:1;height:1px;background:var(--line)}

.practice{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:22px;margin-bottom:16px;box-shadow:var(--shadow);
}
.p-head{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;margin-bottom:6px}
.p-code{
  font-size:calc(12.5px * var(--scale));font-weight:800;color:var(--accent);
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
  border:1.5px solid var(--accent);border-radius:8px;padding:2px 8px;line-height:1.4;
}
.p-title{font-size:calc(18px * var(--scale));font-weight:800;margin:0;letter-spacing:-.025em;flex:1;min-width:200px}
.p-tool{
  display:inline-flex;align-items:center;gap:6px;
  font-size:calc(12.5px * var(--scale));color:var(--muted);font-weight:600;
  background:var(--surface2);border:1px solid var(--line);padding:4px 10px;border-radius:999px;
}
.p-tool svg{width:13px;height:13px}

/* ---------- 프롬프트 카드 ---------- */
.prompts{margin-top:14px;display:flex;flex-direction:column;gap:12px}
.prompt{
  position:relative;border:1px solid var(--line);border-radius:14px;background:var(--surface);
  overflow:hidden;transition:border-color .15s,box-shadow .15s;
}
.prompt:hover{border-color:var(--line2);box-shadow:var(--shadow-hi)}
.prompt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.prompt.t-next::before{background:var(--t-next-fg)}
.prompt.t-fix::before{background:var(--line2)}
.prompt.t-inst::before{background:var(--t-inst-fg)}
.prompt.t-build::before{background:var(--t-build-fg)}
.prompt.t-theory::before{background:var(--line2)}
.prompt.fill{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.prompt.fill::before{background:var(--warn)}
.pr-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px 10px 20px}
.badge{
  font-size:calc(11.5px * var(--scale));font-weight:800;padding:3px 9px;border-radius:7px;letter-spacing:.01em;
  white-space:nowrap;line-height:1.5;
}
.b-input{background:var(--t-input-bg);color:var(--t-input-fg)}
.b-next{background:var(--t-next-bg);color:var(--t-next-fg)}
.b-fix{background:var(--t-fix-bg);color:var(--t-fix-fg)}
.b-inst{background:var(--t-inst-bg);color:var(--t-inst-fg)}
.b-build{background:var(--t-build-bg);color:var(--t-build-fg)}
.b-theory{background:var(--t-theory-bg);color:var(--t-theory-fg);box-shadow:inset 0 0 0 1px var(--line2)}
.b-fillmark{background:var(--warn-soft);color:var(--warn)}
.pr-label{font-size:calc(14px * var(--scale));color:var(--text2);font-weight:700;flex:1;min-width:140px;letter-spacing:-.015em}
.copy{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--text);color:var(--bg);border:none;border-radius:10px;
  padding:0 14px;height:38px;font-size:calc(13px * var(--scale));font-weight:800;cursor:pointer;
  transition:transform .12s,background .15s,opacity .15s;
}
.copy svg{width:15px;height:15px}
.copy:hover{opacity:.88}
.copy:active{transform:scale(.96)}
.copy.done{background:var(--ok);color:#fff}
.pr-body{margin:0 14px 14px 20px;background:var(--panel);border-radius:10px;padding:14px 16px}
.pr-text{
  margin:0;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;
  font-size:calc(15px * var(--scale));line-height:1.78;letter-spacing:-.01em;color:var(--text);
}
.pr-text mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.pr-note{
  display:flex;gap:8px;align-items:flex-start;
  margin:0 14px 14px 20px;font-size:calc(13px * var(--scale));color:var(--warn);
  background:var(--warn-soft);border-radius:10px;padding:10px 12px;line-height:1.55;font-weight:600;
}
.pr-note svg{flex:0 0 auto;width:16px;height:16px;margin-top:2px}

/* ---------- 안내 박스 ---------- */
.callout{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:24px;margin-top:28px;font-size:14.5px;line-height:1.7;box-shadow:var(--shadow);
  display:grid;grid-template-columns:1.4fr 1fr;gap:28px;
}
.callout h2{margin:0 0 14px;font-size:17px;font-weight:800;letter-spacing:-.02em}
.callout ol{margin:0;padding:0;list-style:none;counter-reset:c}
.callout li{position:relative;padding-left:34px;margin-bottom:10px;color:var(--text2)}
.callout li::before{
  counter-increment:c;content:counter(c);position:absolute;left:0;top:1px;
  width:22px;height:22px;border-radius:7px;background:var(--surface2);border:1px solid var(--line);
  font-size:12px;font-weight:800;color:var(--muted);display:flex;align-items:center;justify-content:center;
}
.legend{display:flex;flex-direction:column;gap:10px;border-left:1px solid var(--line);padding-left:28px}
.legend h3{margin:0 0 4px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.legend div{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--text2)}
.legend .badge{min-width:66px;text-align:center}
.legend .lg-fill{display:flex;align-items:center;gap:10px}
.legend .lg-fill i{display:block;width:66px;height:22px;border-radius:7px;border:1.5px solid var(--warn);border-left-width:5px;background:var(--warn-soft)}

.empty{text-align:center;color:var(--muted);padding:80px 20px;font-size:15px}
.empty svg{width:40px;height:40px;margin:0 auto 14px;opacity:.5}

/* ---------- 토스트 · 맨 위로 ---------- */
#toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
  background:var(--text);color:var(--bg);padding:12px 20px;border-radius:999px;
  font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.22s;z-index:100;
  box-shadow:var(--shadow-hi);display:flex;align-items:center;gap:8px;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#totop{
  position:fixed;right:22px;bottom:24px;z-index:60;width:48px;height:48px;border-radius:14px;
  background:var(--surface);color:var(--text);border:1px solid var(--line);box-shadow:var(--shadow-hi);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;
}
#totop.show{opacity:1;transform:none;pointer-events:auto}
#totop svg{width:20px;height:20px}

footer{padding:36px 24px 56px;color:var(--muted);font-size:12.5px;text-align:center;border-top:1px solid var(--line);line-height:1.8}
footer b{color:var(--text2)}

@media (max-width:820px){
  .hero-in{grid-template-columns:1fr}
  .rising{height:84px;gap:6px}
  .rising button{flex:1;width:auto}
  .callout{grid-template-columns:1fr;gap:20px}
  .legend{border-left:none;padding-left:0;border-top:1px solid var(--line);padding-top:18px}
}
@media (max-width:520px){
  .hero-in{padding:36px 16px 28px;gap:26px}
  .sub{font-size:14px}
  .toolbar-in{padding:10px 16px 8px}
  .iconbtn{padding:0 10px;height:44px}
  main{padding:4px 16px 90px}
  .session{margin-top:44px}
  .session-head{gap:14px}
  .session-num{width:58px;height:58px;border-radius:16px}
  .session-num b{font-size:26px}
  .session-title{font-size:calc(20px * var(--scale))}
  .practice{padding:16px;border-radius:16px}
  .pr-top{padding:11px 12px 9px 16px}
  .pr-body,.pr-note{margin-left:16px;margin-right:12px}
  .pr-body{padding:12px 13px}
  .callout{padding:18px}
  #totop{right:14px;bottom:16px}
}

@media print{
  .toolbar,.rising,#toast,#totop,.copy,footer,.stats{display:none!important}
  body{background:#fff;color:#000;font-size:11pt}
  .hero{background:#fff!important;color:#000}
  .hero::before{display:none}
  .hero-in{padding:0 0 12px;display:block}
  .eyebrow,.sub,h1 .h1-sub{color:#333!important}
  .practice,.prompt,.callout{background:#fff;border:1px solid #bbb;box-shadow:none;break-inside:avoid}
  .pr-body{background:#fff;padding:4px 0}
  .session{break-before:page}
  .session-num{background:#000;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .session-stage,.p-code,.chapter-title{color:#000;background:none}
  .badge{border:1px solid #666;background:#fff!important;color:#000!important;box-shadow:none}
  .pr-note{color:#333;background:none;border-top:1px dashed #bbb;border-radius:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-in">
    <div>
      <div class="eyebrow">기아 오토컨설턴트 · 전문가 과정</div>
      <h1>AI 활용 판매상담 Skill-up<span class="h1-sub">프롬프트 모음집</span></h1>
      <p class="sub">1~7차시 실습 프롬프트 전체 · 복사해서 AI에 붙여넣고, 내 고객 상황으로 바꿔 쓰세요</p>
      <div class="stats" id="stats"></div>
    </div>
    <nav class="rising" id="rising" aria-label="차시 바로가기"></nav>
  </div>
</header>

<div class="toolbar">
  <div class="toolbar-in">
    <div class="searchrow">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="차종·키워드로 찾기 (예: 카니발, 보조금, 챗봇)" autocomplete="off" aria-label="프롬프트 검색">
      </label>
      <div class="ctrl">
        <button class="iconbtn" id="fs-down" title="글자 작게">가－</button>
        <button class="iconbtn" id="fs-up" title="글자 크게">가＋</button>
        <button class="iconbtn" id="theme" title="화면 밝기 전환" aria-label="화면 밝기 전환">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="counts" id="counts"></div>
  </div>
</div>

<main id="app"></main>

function totalPrompts(){
  let n=0;
  DATA.forEach(s=>s.chapters.forEach(c=>c.practices.forEach(p=>n+=(p.prompts||[]).length)));
  return n;
}
function sessionPrompts(s){
  let n=0;
  s.chapters.forEach(c=>c.practices.forEach(p=>n+=(p.prompts||[]).length));
  return n;
}
function totalPractices(){
  let n=0;
  DATA.forEach(s=>s.chapters.forEach(c=>n+=c.practices.length));
  return n;
}

function el(tag,cls,txt){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(txt!==undefined)e.textContent=txt;
  return e;
}

function selectSession(val){
  activeSession=val;buildTabs();render();
  const tb=document.querySelector('.toolbar');
  const y=document.querySelector('.hero').offsetHeight;
  if(window.scrollY>y) window.scrollTo({top:y});
  const cur=tabsEl.querySelector('[aria-selected="true"]');
  if(cur) cur.scrollIntoView({block:'nearest',inline:'center'});
}

function buildTabs(){
  const mk=(label,small,val)=>{
    const b=document.createElement('button');
    b.className='tab';b.setAttribute('role','tab');
    b.appendChild(el('b','',label));
    b.appendChild(el('small','',small));
    b.setAttribute('aria-selected', val===activeSession);
    b.onclick=()=>selectSession(val);
    return b;
  };
  tabsEl.innerHTML='';
  tabsEl.appendChild(mk('전체','프롬프트 '+totalPrompts()+'개',0));
  DATA.forEach(s=>tabsEl.appendChild(mk(s.n+'차시',s.stage,s.n)));
}

function buildHero(){
  const st=document.getElementById('stats');
  [[DATA.length,'개 차시'],[totalPractices(),'개 실습'],[totalPrompts(),'개 프롬프트']].forEach(([n,t])=>{
    const d=el('div','stat');d.appendChild(el('b','',String(n)));d.appendChild(document.createTextNode(t));st.appendChild(d);
  });
  const r=document.getElementById('rising');
  DATA.forEach(s=>{
    const b=document.createElement('button');
    b.title=s.n+'차시 · '+s.title;
    b.setAttribute('aria-label',s.n+'차시 · '+s.title);
    b.appendChild(el('span','',String(s.n)));
    b.onclick=()=>{selectSession(s.n);window.scrollTo({top:document.querySelector('.hero').offsetHeight});};
    r.appendChild(b);
  });
}

/* 검색어 강조 (화면 표시용 · 복사 내용과 무관) */
function fillText(node,text,kw){
  if(!kw){node.textContent=text;return;}
  const low=text.toLowerCase();let i=0,j;
  while((j=low.indexOf(kw,i))!==-1){
    if(j>i) node.appendChild(document.createTextNode(text.slice(i,j)));
    node.appendChild(el('mark','',text.slice(j,j+kw.length)));
    i=j+kw.length;
  }
  if(i<text.length) node.appendChild(document.createTextNode(text.slice(i)));
}

/* 프롬프트 카드 한 장 */
function promptCard(it,kw){
  const pr=it.pr;
  const box=el('div','prompt t-'+pr.t+(pr.fill?' fill':''));
  const top=el('div','pr-top');
  top.appendChild(el('span','badge '+T[pr.t][0],T[pr.t][1]));
  if(pr.fill) top.appendChild(el('span','badge b-fillmark','내 상황으로 바꿔 쓰기'));
  const lb=el('span','pr-label');fillText(lb,pr.l,kw);top.appendChild(lb);
  const btn=el('button','copy');
  btn.innerHTML=ICON.copy+'<span>복사</span>';
  btn.onclick=()=>doCopy(pr.x,btn);
  top.appendChild(btn);
  box.appendChild(top);
  const body=el('div','pr-body');
  const p=el('p','pr-text');fillText(p,pr.x,kw);
  body.appendChild(p);
  box.appendChild(body);
  if(pr.note){
    const n=el('div','pr-note');
    n.innerHTML=ICON.info;
    const sp=el('span');fillText(sp,pr.note,kw);n.appendChild(sp);
    box.appendChild(n);
  }
  return box;
}

     '빨간 테두리 카드는 그대로 보내면 안 됩니다. 고객 상황이나 숫자를 내 것으로 바꿔 넣은 다음 보내세요.',
     '상담 중에는 검색창에 차종이나 키워드를 넣어 필요한 프롬프트만 바로 찾으세요.',
     '고객 실명·전화번호는 어떤 프롬프트에도 넣지 마세요. 나이대·차종·상담 내용만으로 충분합니다.',
     '보조금·금리·보증기간 같은 숫자는 AI에게 묻지 말고, 공식 자료에서 확인한 값을 넣으세요.',
     'AI가 준 답은 고객에게 쓰기 전에 꼭 읽어 보세요.'
    ].forEach(t=>ul.appendChild(el('li','',t)));
    left.appendChild(ul);
    c.appendChild(left);

    const lg=el('div','legend');
    lg.appendChild(el('h3','','카드 유형'));
    [['input','새로 입력'],['next','앞 대화에 이어서 입력'],['fix','결과 다듬기 (짧은 수정 요청)'],
     ['inst','챗봇 지침 (Gems/GPTs 지침 칸에 붙여넣기)'],['build','도구 제작 (HTML 결과물)']].forEach(([k,d])=>{
      const row=el('div');row.appendChild(el('span','badge '+T[k][0],T[k][1]));row.appendChild(el('span','',d));lg.appendChild(row);
    });
    const fr=el('div','lg-fill');fr.appendChild(el('i'));fr.appendChild(el('span','','빨간 테두리 = 내 상황으로 바꿔 쓰기'));
    lg.appendChild(fr);
    c.appendChild(lg);
    app.appendChild(c);
  }

  DATA.forEach(s=>{
    if(activeSession && s.n!==activeSession) return;
    const sess=el('section','session');sess.id='s'+s.n;
    const head=el('div','session-head');
    const num=el('div','session-num');
    num.appendChild(el('small','','차시'));
    num.appendChild(el('b','',String(s.n).padStart(2,'0')));
    head.appendChild(num);
    const tw=el('div');
    tw.appendChild(el('div','session-stage',s.stage));
    tw.appendChild(el('h2','session-title',s.title));
    head.appendChild(tw);
    sess.appendChild(head);

    let sessHas=false;

    s.chapters.forEach((ch,ci)=>{
      const chEl=el('div','chapter');
      chEl.appendChild(el('div','chapter-title',ch.title));
      let chHas=false;

      ch.practices.forEach((p,pi)=>{
        const all=(p.prompts||[]).map(pr=>({pr:pr}));
        const list=all.filter(it=>{
          if(!kw) return true;
          const pr=it.pr;
          return (pr.x+' '+pr.l+' '+(pr.note||'')+' '+p.title+' '+ch.title+' '+(p.tool||'')).toLowerCase().includes(kw);
        });
        if(kw && list.length===0) return;
        if(kw && (p.prompts||[]).length===0) return;
        if(!kw && (p.prompts||[]).length>0 && list.length===0) return;

        const pe=el('article','practice');
        const ph=el('div','p-head');
        ph.appendChild(el('span','p-code',p.code));
        ph.appendChild(el('h3','p-title',p.title));
        if(p.tool){
          const tl=el('span','p-tool');tl.innerHTML=ICON.tool;tl.appendChild(el('span','',p.tool));ph.appendChild(tl);
        }
        pe.appendChild(ph);

        const wrap=el('div','prompts');
        list.forEach(it=>{
          shown++;
          wrap.appendChild(promptCard(it,kw));
        });
        pe.appendChild(wrap);

        chEl.appendChild(pe);
        chHas=true;
      });

      if(chHas){sess.appendChild(chEl);sessHas=true;}
    });

    if(sessHas) app.appendChild(sess);
  });

  if(shown===0){
    const e=el('div','empty');e.innerHTML=ICON.empty;
    e.appendChild(el('div','','찾는 프롬프트가 없습니다. 다른 낱말로 검색해 보세요.'));
    app.appendChild(e);
  }
  countsEl.textContent = kw
    ? '검색 결과 '+shown+'개'
    : '전체 프롬프트 '+totalPrompts()+'개 · 7개 차시';
}

/* ===== 복사 ===== */
function doCopy(text,btn){
  const ok=()=>{
    btn.innerHTML=ICON.check+'<span>복사됨</span>';btn.classList.add('done');
    toast('복사했습니다');
    setTimeout(()=>{btn.innerHTML=ICON.copy+'<span>복사</span>';btn.classList.remove('done');},1600);
  };
  const fallback=()=>{
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.style.position='fixed';ta.style.top='0';ta.style.left='0';ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.focus();ta.select();ta.setSelectionRange(0,text.length);
    let done=false;
    try{done=document.execCommand('copy');}catch(e){done=false;}
    document.body.removeChild(ta);
    done?ok():toast('복사가 안 됩니다. 길게 눌러 직접 선택하세요');
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(ok).catch(fallback);
  }else{
    fallback();
  }
}

let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1500);
}

/* ===== 컨트롤 ===== */
let scale=1;
function setScale(v){
  scale=Math.round(Math.min(1.7,Math.max(0.85,v))*100)/100;
  document.documentElement.style.setProperty('--scale',scale);
  toast('글자 크기 '+Math.round(scale*100)+'%');
}
document.getElementById('fs-up').onclick=()=>setScale(scale+0.12);
document.getElementById('fs-down').onclick=()=>setScale(scale-0.12);
try{const saved=localStorage.getItem('kia-prompt-theme');if(saved)document.documentElement.setAttribute('data-theme',saved);}catch(e){}
document.getElementById('theme').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const nx=cur==='light'?'dark':'light';
  document.documentElement.setAttribute('data-theme',nx);
  try{localStorage.setItem('kia-prompt-theme',nx);}catch(e){}
};
let qt;
qEl.addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(render,140);});

const topBtn=document.getElementById('totop');
topBtn.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
window.addEventListener('scroll',()=>topBtn.classList.toggle('show',window.scrollY>600),{passive:true});

buildHero();
buildTabs();
render();
</script>
